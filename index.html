<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
 <title>Flappy Bird</title>
   <link rel="stylesheet" href="styles.css">
</head>
 <body>
  <div id="game-container">
 <canvas id="gameCanvas" width="400" height="600"></canvas>
    
 <div id="menu-overlay" class="overlay active">
  <h1 class="title">FLAPPY BIRD</h1>
    <p class="subtitle">Press SPACE, Click, or Tap to Jump</p>
   <button id="start-btn" class="btn">PLAY GAME</button>
</div>

  <div id="gameover-overlay" class="overlay">
   <h2 class="title-over">GAME OVER</h2>
     <div class="score-card">
   <div class="score-row">
     <span>SCORE</span>
        <span id="final-score">0</span>
</div>
    <div class="score-row">
  <span>BEST</span>
       <span id="best-score">0</span>
 </div>
  <div class="medal-container">
   <span>MEDAL</span>
      <div id="medal" class="medal"></div>
    </div>
   </div>
 <button id="restart-btn" class="btn">PLAY AGAIN</button>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
